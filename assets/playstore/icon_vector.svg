<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042617"/>
      <stop offset="45%" stop-color="#0B4F32"/>
      <stop offset="100%" stop-color="#126E45"/>
    </linearGradient>

    <!-- Top Highlight Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Mint/Emerald Glow -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- House Front Gradient -->
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#34D399" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with 32-bit Alpha corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="url(#sheenGrad)" stroke-width="4"/>

  <!-- Radial Ambient Lighting Circle in Center -->
  <circle cx="256" cy="220" r="160" fill="#15803D" opacity="0.4" filter="blur(30px)"/>

  <!-- Background Tower / Building Silhouette (representing flats & urban housing) -->
  <g filter="url(#shadowFilter)">
    <!-- High-rise Building Silhouette -->
    <path d="M280 130 H360 V290 H280 Z" fill="#063520" opacity="0.9"/>
    <rect x="296" y="150" width="16" height="18" rx="2" fill="#34D399" opacity="0.6"/>
    <rect x="328" y="150" width="16" height="18" rx="2" fill="#34D399" opacity="0.6"/>
    <rect x="296" y="180" width="16" height="18" rx="2" fill="#FDE68A" opacity="0.7"/>
    <rect x="328" y="180" width="16" height="18" rx="2" fill="#34D399" opacity="0.6"/>
    <rect x="296" y="210" width="16" height="18" rx="2" fill="#34D399" opacity="0.6"/>
    <rect x="328" y="210" width="16" height="18" rx="2" fill="#FDE68A" opacity="0.7"/>
  </g>

  <!-- Main House / Villa Symbol (representing Land & Housing) with Shadow -->
  <g filter="url(#shadowFilter)">
    <!-- Roof Overhang -->
    <path d="M120 220 L240 120 L360 220 L336 220 L240 140 L144 220 Z" fill="url(#goldGrad)"/>
    
    <!-- Main House Body -->
    <path d="M144 218 L240 138 L336 218 V310 H144 Z" fill="url(#houseGrad)"/>

    <!-- Roof Ridge Highlight -->
    <path d="M240 138 L336 218 L320 218 L240 152 L160 218 L144 218 Z" fill="#FFFFFF" opacity="0.8"/>

    <!-- Modern Front Door with Arch -->
    <path d="M216 310 V236 Q240 220 264 236 V310 Z" fill="url(#bgGrad)"/>
    <!-- Door Handle in Gold -->
    <circle cx="254" cy="272" r="3.5" fill="url(#goldGrad)"/>

    <!-- Left & Right Modern Windows -->
    <rect x="164" y="240" width="32" height="32" rx="6" fill="#0B4F32" opacity="0.85"/>
    <line x1="180" y1="240" x2="180" y2="272" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="164" y1="256" x2="196" y2="256" stroke="#FFFFFF" stroke-width="2"/>

    <rect x="284" y="240" width="32" height="32" rx="6" fill="#0B4F32" opacity="0.85"/>
    <line x1="300" y1="240" x2="300" y2="272" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="284" y1="256" x2="316" y2="256" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Location Pin / Shield Base Ribbon (Golden Curved Foundation) -->
  <g filter="url(#shadowFilter)">
    <path d="M100 324 Q240 346 380 324 Q240 366 100 324 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Verification Badge / Trust Shield in Top Right -->
  <g filter="url(#glowFilter)" transform="translate(330, 96)">
    <circle cx="28" cy="28" r="24" fill="url(#goldGrad)"/>
    <circle cx="28" cy="28" r="21" fill="#0B4F32"/>
    <!-- Checkmark -->
    <path d="M19 28 L25 34 L37 21" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Branding Text: bdHousing -->
  <g filter="url(#shadowFilter)">
    <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="52" letter-spacing="1.5">
      <tspan fill="#FFFFFF">bd</tspan><tspan fill="url(#goldGrad)">Housing</tspan>
    </text>
    <!-- Tagline: আবাসন মার্কেটপ্লেস -->
    <text x="256" y="454" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Hind Siliguri', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="20" fill="#A7F3D0" letter-spacing="2">
      জমি ও ফ্ল্যাট মার্কেটপ্লেস
    </text>
  </g>

  <!-- Top Curved Glass Gloss Reflection -->
  <path d="M0 115 C0 51 51 0 115 0 L397 0 C461 0 512 51 512 115 L512 180 C360 140 180 180 0 240 Z" fill="url(#sheenGrad)" opacity="0.6"/>
</svg>
