server:
  port: ${PORT:8085}

spring:
  application:
    name: landtrust-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/landtrust_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

